<header class="ui-header-materia">
  <div class="ui-header-materia-info">
    <h2 class="ui-header-materia-title">
      {{ title }}
    </h2>

    <div class="ui-header-materia-badges">
      <span class="ui-header-materia-badge">
        {{ semester }}
        <span style="width:14px;height:14px;border:1px solid currentColor;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;">i</span>
      </span>
      <span class="ui-header-materia-badge">
        {{ group }}
        <span style="width:14px;height:14px;border:1px solid currentColor;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;">i</span>
      </span>
    </div>
  </div>

  @if (showBackButton) {
    <button
      class="ui-header-materia-back"
      type="button"
      (click)="onBackClick()">
      Regresar
      <span>←</span>
    </button>
  }
</header>
