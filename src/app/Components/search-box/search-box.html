<div class="search-box" [class.active]="isActive">
  <input
    type="text"
    placeholder="Buscar"
    (focus)="onFocus()"
    (blur)="onBlur()"
    (input)="onInput($event)"
    aria-label="Buscar"
  />
  <span class="search-trigger" (click)="onSearchClick()">
    <app-icon name="search" [size]="16" color="blue"></app-icon>
  </span>
</div>
