<main class="component-preview">
  <h1 class="preview-title">Componentes del Dashboard</h1>

  <section class="preview-section">
    <h2 class="preview-subtitle">Label</h2>

    <div class="preview-row">
      <app-ui-label text="Label"></app-ui-label>

      <app-ui-label text="Label" variant="warning"></app-ui-label>

      <app-ui-label text="Label" variant="error"></app-ui-label>

      <app-ui-label text="Label" variant="disabled"></app-ui-label>

      <app-ui-label text="Label" percent="0%"></app-ui-label>
    </div>
  </section>

  <section class="preview-section">
  <h2 class="preview-subtitle">Progress Bar</h2>

  <div class="preview-column">
      <app-ui-progress-bar label="Label" [value]="0"></app-ui-progress-bar>

      <app-ui-progress-bar label="Label" [value]="25"></app-ui-progress-bar>

      <app-ui-progress-bar label="Label" [value]="50"></app-ui-progress-bar>

      <app-ui-progress-bar label="Label" [value]="75"></app-ui-progress-bar>

      <app-ui-progress-bar label="Label" [value]="100"></app-ui-progress-bar>

      <app-ui-progress-bar
        label="Label"
        [value]="100"
        variant="success"
        [showPercent]="false"
      ></app-ui-progress-bar>

      <app-ui-progress-bar
        label="Label"
        [value]="100"
        variant="error"
        [showPercent]="false"
      ></app-ui-progress-bar>
    </div>
  </section>
  <section class="preview-section">
    <h2 class="preview-subtitle">Badge</h2>
    <div class="preview-row">
      <app-badge label="INFO" color="blue" variant="outline" />
      <app-badge label="ÉXITO" color="green" variant="outline" />
      <app-badge label="ALERTA" color="yellow" variant="outline" />
      <app-badge label="ERROR" color="red" variant="outline" />
      
      

      
      <app-badge label="INFO" color="blue" variant="filled" />
      <app-badge label="ÉXITO" color="green" variant="filled" />
      <app-badge label="ALERTA" color="yellow" variant="filled" />
      <app-badge label="ERROR" color="red" variant="filled" />

      <app-badge label="DESHABILITADO" color="disabled" variant="outline" />
      
    </div>
  </section>
  <section class="preview-section">
    <h2 class="preview-subtitle">Search-Box</h2>
    <div class="preview-row">
      <app-search-box></app-search-box>
    </div>
  </section>

  <section class="preview-section">
  <h2 class="preview-subtitle">Card</h2>

  <div class="preview-card-grid">
    <app-ui-card
      title="Title"
      subtitle="Subtitle"
      description="Texto"
      progressLabel="Label"
      [progressValue]="0"
      buttonText="Button"
      footerLabel="Label"
      variant="primary"
    ></app-ui-card>

    <app-ui-card
      title="Title"
      subtitle="Subtitle"
      description="Texto"
      progressLabel="Label"
      [progressValue]="0"
      buttonText="Button"
      footerLabel="Label"
      variant="success"
    ></app-ui-card>

    <app-ui-card
      title="Title"
      subtitle="Subtitle"
      description="Texto"
      progressLabel="Label"
      [progressValue]="0"
      buttonText="Button"
      footerLabel="Label"
      variant="warning"
    ></app-ui-card>

    <app-ui-card
      title="Title"
      subtitle="Subtitle"
      description="Texto"
      progressLabel="Label"
      [progressValue]="0"
      buttonText="Button"
      footerLabel="Label"
      variant="error"
    ></app-ui-card>
  </div>
</section>
</main>

<router-outlet />
