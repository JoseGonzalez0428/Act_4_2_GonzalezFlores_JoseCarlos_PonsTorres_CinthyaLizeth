<main class="component-preview">
  <h1 class="preview-title">Componentes del Dashboard</h1>

  <section class="preview-section">
    <h2 class="preview-subtitle">Label</h2>

    <div class="preview-row">
      <app-ui-label text="Label"></app-ui-label>

      <app-ui-label text="Label" variant="warning"></app-ui-label>

      <app-ui-label text="Label" variant="error"></app-ui-label>

      <app-ui-label text="Label" variant="disabled"></app-ui-label>

      <app-ui-label text="Label" percent="0%"></app-ui-label>
    </div>
  </section>

  <section class="preview-section">
  <h2 class="preview-subtitle">Progress Bar</h2>

  <div class="preview-column">
      <app-ui-progress-bar label="Label" [value]="0"></app-ui-progress-bar>

      <app-ui-progress-bar label="Label" [value]="25"></app-ui-progress-bar>

      <app-ui-progress-bar label="Label" [value]="50"></app-ui-progress-bar>

      <app-ui-progress-bar label="Label" [value]="75"></app-ui-progress-bar>

      <app-ui-progress-bar label="Label" [value]="100"></app-ui-progress-bar>

      <app-ui-progress-bar
        label="Label"
        [value]="100"
        variant="success"
        [showPercent]="false"
      ></app-ui-progress-bar>

      <app-ui-progress-bar
        label="Label"
        [value]="100"
        variant="error"
        [showPercent]="false"
      ></app-ui-progress-bar>
    </div>
  </section>
</main>

<router-outlet />
