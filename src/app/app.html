<main class="component-preview">
  <h1 class="preview-title">Componentes del Dashboard</h1>

  <section class="preview-section">
    <h2 class="preview-subtitle">Label</h2>

    <div class="preview-row">
      <app-ui-label text="Label"></app-ui-label>

      <app-ui-label text="Label" variant="warning"></app-ui-label>

      <app-ui-label text="Label" variant="error"></app-ui-label>

      <app-ui-label text="Label" variant="disabled"></app-ui-label>

      <app-ui-label text="Label" percent="0%"></app-ui-label>
    </div>
  </section>

  <section class="preview-section">
    <h2 class="preview-subtitle">Calendar Cell</h2>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
      <app-cell number="01" description="Description" color="blue" variant="outline"></app-cell>
      <app-cell number="01" description="Description" color="blue" variant="filled"></app-cell>

      <app-cell number="01" description="Description" color="blue" variant="dark"></app-cell>
      <app-cell number="01" description="Description" color="green" variant="outline"></app-cell>

      <app-cell number="01" description="Description" color="green" variant="filled"></app-cell>
      <app-cell number="01" description="Description" color="green" variant="dark"></app-cell>

      <app-cell number="01" description="Description" color="yellow" variant="outline"></app-cell>
      <app-cell number="01" description="Description" color="yellow" variant="filled"></app-cell>

      <app-cell number="01" description="Description" color="yellow" variant="dark"></app-cell>
      <app-cell number="01" description="Description" color="red" variant="outline"></app-cell>

      <app-cell number="01" description="Description" color="red" variant="filled"></app-cell>
      <app-cell number="01" description="Description" color="red" variant="dark"></app-cell>
    </div>
  </section>

  <section class="preview-section">
  <h2 class="preview-subtitle">Progress Bar</h2>

  <div class="preview-column">
      <app-ui-progress-bar label="Label" [value]="0"></app-ui-progress-bar>

      <app-ui-progress-bar label="Label" [value]="25"></app-ui-progress-bar>

      <app-ui-progress-bar label="Label" [value]="50"></app-ui-progress-bar>

      <app-ui-progress-bar label="Label" [value]="75"></app-ui-progress-bar>

      <app-ui-progress-bar label="Label" [value]="100"></app-ui-progress-bar>

      <app-ui-progress-bar
        label="Label"
        [value]="100"
        variant="success"
        [showPercent]="false"
      ></app-ui-progress-bar>

      <app-ui-progress-bar
        label="Label"
        [value]="100"
        variant="error"
        [showPercent]="false"
      ></app-ui-progress-bar>
    </div>
  </section>
  <section class="preview-section">
    <h2 class="preview-subtitle">Badge</h2>
    <div class="preview-row">
      <app-badge label="INFO" color="blue" variant="outline" icon="info"></app-badge>
      <app-badge label="INFO" color="blue" variant="filled" icon="info"></app-badge>
      <app-badge label="ALERTA" color="yellow" variant="outline" icon="warning"></app-badge>
      
      <app-badge label="ALERTA" color="yellow" variant="filled" icon="warning"></app-badge>
      <app-badge label="ERROR" color="red" variant="outline" icon="close"></app-badge>
      <app-badge label="ERROR" color="red" variant="filled" icon="close"></app-badge>

      <app-badge label="ÉXITO" color="green" variant="outline" icon="check"></app-badge>
      <app-badge label="ÉXITO" color="green" variant="filled" icon="check"></app-badge>
      
      
      
    </div>
  </section>
  <section class="preview-section">
    <h2 class="preview-subtitle">Search-Box</h2>
    <div class="preview-row">
      <app-search-box></app-search-box>
    </div>
  </section>

  <section class="preview-section">
    <h2 class="preview-subtitle">Card</h2>

    <div class="preview-card-grid">
      <app-ui-card
        title="Title"
        subtitle="Subtitle"
        description="Texto"
        progressLabel="Label"
        [progressValue]="0"
        buttonText="Button"
        footerLabel="Label"
        variant="primary"
      ></app-ui-card>

      <app-ui-card
        title="Title"
        subtitle="Subtitle"
        description="Texto"
        progressLabel="Label"
        [progressValue]="0"
        buttonText="Button"
        footerLabel="Label"
        variant="success"
      ></app-ui-card>

      <app-ui-card
        title="Title"
        subtitle="Subtitle"
        description="Texto"
        progressLabel="Label"
        [progressValue]="0"
        buttonText="Button"
        footerLabel="Label"
        variant="warning"
      ></app-ui-card>

      <app-ui-card
        title="Title"
        subtitle="Subtitle"
        description="Texto"
        progressLabel="Label"
        [progressValue]="0"
        buttonText="Button"
        footerLabel="Label"
        variant="error"
      ></app-ui-card>
    </div>
  </section>
  <section class="preview-section">
    <h2 class="preview-subtitle">Button</h2>
    <div class="preview-row">
      <app-button label="Button" variant="primary"></app-button>
      <app-button label="Button" variant="primary-hover"></app-button>
      <app-button label="Button" variant="primary-active"></app-button>
      <app-button label="Button" variant="disabled"></app-button>
      <app-button label="Button" variant="secondary"></app-button>
      <app-button label="Button" variant="secondary-hover"></app-button>
      <app-button label="Button" variant="secondary-active"></app-button>
      <app-button label="Button" variant="success"></app-button>
      <app-button label="Button" variant="warning"></app-button>
      <app-button label="Button" variant="error"></app-button>
      

      <app-button label="Descargar" variant="primary" icon="download"></app-button>
      <app-button label="Buscar" variant="secondary" icon="search"></app-button>
      <app-button label="Editar" variant="success" icon="edit"></app-button>
    </div>
  </section>
  <section>
    <app-ui-card
      title="Title"
      subtitle="Subtitle"
      description="Texto"
      progressLabel="Label"
      [progressValue]="0"
      buttonText="Button"
      footerLabel="Label"
      variant="error"
    ></app-ui-card>
  </section>

<section class="preview-section">
  <h2 class="preview-subtitle">Calendario</h2>

  <app-ui-calendar></app-ui-calendar>
</section>

<section class="preview-section">
  <h2 class="preview-subtitle">Footer UASLP</h2>

  <app-ui-footer-uaslp></app-ui-footer-uaslp>
</section>
<router-outlet />

<section class="preview-section">
  <h2 class="preview-subtitle">Header UASLP</h2>

  <app-ui-header-uaslp logoSrc="logo-png/aguilaa-logo.png"></app-ui-header-uaslp>
</section>

<section class="preview-section">
  <h2 class="preview-subtitle">Header Materia</h2>

  <app-ui-header-materia
    title="Title"
    semester="Semestre-2026/1"
    group="Grupo-2026"
  ></app-ui-header-materia>
</section>

<section class="preview-section">
  <h2 class="preview-subtitle">Input</h2>

  <app-input label="Text" placeholder="Placeholder" status="default"></app-input>
  <app-input label="Text" placeholder="Input" status="focus"></app-input>
  <app-input label="Text" placeholder="Placeholder" status="success"></app-input>
  <app-input label="Text" placeholder="Placeholder" status="warning"></app-input>
  <app-input label="Text" placeholder="Placeholder" status="error"></app-input>
  <app-input label="Text" placeholder="Placeholder" status="disabled"></app-input>
</section>

<section class="preview-section">
  <h2 class="preview-subtitle">Forms</h2>

  <div class="preview-forms-grid">
    <app-ui-activity-form></app-ui-activity-form>

    <app-ui-matter-form></app-ui-matter-form>
  </div>
</section>
</main>
